<style>
/* Layout: app a una colonna, barra vitale fissa in alto, schede scorrevoli, tiradadi flottante */
:root{
  --bg:#EFE4CC; --surface:#FBF4E3; --sunk:#EADBBB; --line:#CBB48A; --line-soft:#E2D1AC;
  --fg:#2A1D12; --muted:#6F5A40;
  --accent:#8B1E2F; --accent-2:#B0323F; --accent-fg:#FFF6E6; --accent-soft:#F1D9CF;
  --gold:#94650F; --gold-2:#C99A3A; --gold-soft:#F2E2B8;
  --hp:#2F7D4A; --hp-mid:#B7800F; --hp-low:#B3261E; --temp:#3866B8;
  --shadow:0 1px 0 rgba(255,255,255,.6) inset,0 2px 10px rgba(74,48,18,.12);
  --paper:radial-gradient(120% 80% at 50% -10%,rgba(255,250,235,.9),transparent 60%),radial-gradient(90% 70% at 100% 100%,rgba(150,105,45,.16),transparent 60%),radial-gradient(80% 60% at 0% 100%,rgba(150,105,45,.12),transparent 60%);
  --f-display:"Cinzel",Georgia,serif; --f-deco:"Cinzel Decorative","Cinzel",Georgia,serif; --f-body:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-num:"Alegreya","Cinzel",Georgia,serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14100C; --surface:#211913; --sunk:#2C2219; --line:#4C3B28; --line-soft:#3A2D20;
  --fg:#F1E6D0; --muted:#B9A688;
  --accent:#E0644F; --accent-2:#F08A5D; --accent-fg:#1A120C; --accent-soft:#3D2018;
  --gold:#E3B456; --gold-2:#F2CF7E; --gold-soft:#3A2E17;
  --hp:#5CC27E; --hp-mid:#E3B456; --hp-low:#F06A5A; --temp:#86A8F0;
  --shadow:0 2px 14px rgba(0,0,0,.45);
  --paper:radial-gradient(100% 60% at 50% -10%,rgba(240,140,70,.10),transparent 60%),radial-gradient(70% 50% at 100% 100%,rgba(227,180,86,.06),transparent 60%);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14100C; --surface:#211913; --sunk:#2C2219; --line:#4C3B28; --line-soft:#3A2D20;
  --fg:#F1E6D0; --muted:#B9A688;
  --accent:#E0644F; --accent-2:#F08A5D; --accent-fg:#1A120C; --accent-soft:#3D2018;
  --gold:#E3B456; --gold-2:#F2CF7E; --gold-soft:#3A2E17;
  --hp:#5CC27E; --hp-mid:#E3B456; --hp-low:#F06A5A; --temp:#86A8F0;
  --shadow:0 2px 14px rgba(0,0,0,.45);
  --paper:radial-gradient(100% 60% at 50% -10%,rgba(240,140,70,.10),transparent 60%),radial-gradient(70% 50% at 100% 100%,rgba(227,180,86,.06),transparent 60%);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper),var(--bg);background-attachment:fixed;color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);letter-spacing:.02em;text-wrap:balance;margin:0}
h2{font-size:1.1rem;color:var(--accent)}
h2::before{content:"✦ ";color:var(--gold-2);font-size:.8em}
.card-h h2,.card>h2{padding-bottom:6px;border-bottom:1px solid var(--line-soft);flex:1 1 auto}
h3{font-size:.95rem}
.num{font-family:var(--f-num);font-variant-numeric:lining-nums tabular-nums}
.muted{color:var(--muted)}
.lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:linear-gradient(var(--surface),var(--surface)) padding-box;border-bottom:2px solid var(--gold-2);box-shadow:0 2px 0 var(--line-soft),0 6px 18px rgba(40,24,8,.12)}
.bar{display:flex;gap:8px;align-items:center;padding-block:8px}
.brand{font-family:var(--f-deco);font-weight:700;font-size:1.05rem;white-space:nowrap;color:var(--accent)}
.ctx{flex:1 1 auto;min-width:0;display:grid;text-align:left;background:none;border:0;border-left:1px solid var(--line);padding:2px 0 2px 10px;color:inherit;font:inherit;cursor:pointer}
.ctx small{font-size:.72rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctx b{font-size:.98rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctx b::after{content:" ▸";color:var(--muted);font-weight:400;font-size:.8em}
.sync{background:none;border:0;padding:8px;cursor:pointer;display:grid;place-items:center}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--hp);display:block}
.sync.wait i{background:var(--hp-mid)}.sync.err i{background:var(--hp-low)}
.vital{display:flex;gap:10px;align-items:center;padding-block:4px 8px;flex-wrap:wrap}
.vital .who{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40%}
.hpbar{flex:1 1 160px;min-width:140px;height:22px;border-radius:6px;background:var(--sunk);position:relative;overflow:hidden;border:1px solid var(--line)}
.hpbar i{position:absolute;inset:0 auto 0 0;background:var(--hp);transition:width .25s}
.hpbar b{position:absolute;inset:0 0 0 auto;background:var(--temp);opacity:.55}
.hpbar span{position:relative;display:block;text-align:center;font:700 .8rem/22px var(--f-num)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:9px 12px;border-bottom:3px solid transparent;color:var(--muted);font:700 .92rem var(--f-body);white-space:nowrap;cursor:pointer;display:flex;gap:6px;align-items:center}
.tabs button .ic{font-size:1.05rem;line-height:1}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.cloud{font-size:.72rem;color:var(--muted);white-space:nowrap}

/* blocks */
main{padding-block:16px calc(120px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 0 0 3px var(--surface) inset,0 0 0 4px var(--line-soft) inset,var(--shadow);padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;min-width:0}
.list{grid-template-columns:minmax(0,1fr)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.f{display:grid;gap:3px;min-width:0;align-content:start}
.fields{align-items:start}
input,select,textarea{background:color-mix(in srgb,var(--surface) 60%,var(--bg));border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);padding:0}
textarea{min-height:90px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:linear-gradient(var(--surface),var(--sunk));border-radius:9px;padding:8px 13px;min-height:36px;cursor:pointer;font-weight:600;font-size:.88rem;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:linear-gradient(var(--accent-2),var(--accent));color:var(--accent-fg);border-color:var(--gold-2);box-shadow:0 1px 0 rgba(255,255,255,.25) inset}
.btn.pri:hover{filter:brightness(1.08);background:linear-gradient(var(--accent-2),var(--accent))}
.btn.sm{padding:5px 10px;font-size:.84rem;min-height:32px}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--hp-low)}
.btn:disabled{opacity:.45;cursor:default}

/* abilities */
.abil{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media (max-width:560px){.abil{grid-template-columns:repeat(3,1fr)}}
.ab{background:var(--sunk);border:1px solid var(--line-soft);border-radius:12px 12px 22px 22px;padding:8px 6px;text-align:center;display:grid;gap:4px;justify-items:center}
.ab .mod{font:700 1.35rem var(--f-num);cursor:pointer;background:none;border:0;padding:0}
.ab .mod:hover{color:var(--accent)}
.ab input{width:52px;text-align:center;padding:3px;font-family:var(--f-num)}
.abl{display:flex;align-items:center;gap:4px;font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.abl span{width:30px;text-align:right}
.abl.tmp input{border-style:dashed}
.eff{font:600 .75rem var(--f-num);color:var(--muted)}
.eff.up{color:var(--hp)}.eff.down{color:var(--hp-low)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.stat{background:var(--sunk);border-radius:9px;padding:8px;display:grid;gap:2px;text-align:center}
.stat .v{font:700 1.15rem var(--f-num)}
.stat input{text-align:center;font:700 1.05rem var(--f-num);padding:2px;background:var(--surface)}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 14px}
.sk{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line)}
.sk .name{flex:1;min-width:0}
.sk .ab3{font-size:.7rem;color:var(--muted)}
.prof{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);background:none;cursor:pointer;padding:0;flex:none}
.prof.p1{background:var(--accent);border-color:var(--accent)}
.prof.p2{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 2px var(--surface) inset}
.rollv{font:700 .9rem var(--f-num);min-width:38px;text-align:right;background:none;border:0;cursor:pointer;padding:2px 4px;border-radius:5px}
.rollv:hover{background:var(--accent-soft);color:var(--accent)}

/* chips / pips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:.8rem;background:var(--surface);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip.static{cursor:default}
.tag{display:inline-block;font-size:.7rem;padding:1px 7px;border-radius:99px;background:var(--sunk);color:var(--muted);font-weight:600}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.tag.gold{background:var(--gold-soft);color:var(--gold)}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pip{width:18px;height:18px;border-radius:4px;border:2px solid var(--gold);background:var(--gold);cursor:pointer;padding:0}
.pip.used{background:none;opacity:.6}
.pip.death-s{border-color:var(--hp);background:none}.pip.death-s.on{background:var(--hp)}
.pip.death-f{border-color:var(--hp-low);background:none}.pip.death-f.on{background:var(--hp-low)}

/* list items */
.list{display:grid;gap:8px}
details.it{border:1px solid var(--line);border-radius:9px;background:var(--surface)}
details.it>summary{list-style:none;display:flex;gap:8px;align-items:center;padding:9px 11px;cursor:pointer}
details.it>summary::-webkit-details-marker{display:none}
details.it>summary .t{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.it[open]>summary{border-bottom:1px solid var(--line)}
details.it .body{padding:11px;display:grid;gap:10px}
.empty{color:var(--muted);font-size:.9rem;padding:8px 2px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.slot{background:var(--sunk);border-radius:9px;padding:8px;display:grid;gap:6px}
.slot .row input{width:52px;padding:2px 4px;text-align:center}
.spellcard{display:grid;gap:10px}
.sp-brief{font-weight:600}
details.it>summary .t.tt{display:grid;gap:1px;white-space:normal}
.t.tt small{display:block}
.t.tt>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t.tt small{font-weight:400;color:var(--muted);font-size:.78rem;line-height:1.3}
.sp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px 14px;background:var(--sunk);border-radius:8px;padding:10px}
.sp-desc{display:grid;gap:8px;max-width:68ch}
.conc{background:var(--gold-soft);color:var(--fg);border:1px solid var(--gold);border-radius:9px;padding:8px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* combat */
.cmb{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.cmb.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.cmb.down{opacity:.55}
.hm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:8px}
.hm-char{display:grid;gap:4px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:inherit;font:inherit;cursor:pointer;min-width:0}
.hm-char:hover,.hm-char:focus-visible{border-color:var(--accent)}
.hm-n{font-weight:700;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hm-s{font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hm-camp.cur{border-color:var(--accent)}
/* cornici di classe */
.hm-char.cls{position:relative;border:2px solid var(--cc);padding:12px 14px 12px;padding-right:52px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--cc) 18%,var(--surface)),var(--surface) 55%,color-mix(in srgb,var(--cc) 8%,var(--surface)));
  box-shadow:0 0 0 3px var(--surface) inset,0 0 0 4px color-mix(in srgb,var(--cc) 45%,transparent) inset,0 3px 12px color-mix(in srgb,var(--cd) 30%,transparent)}
.hm-char.cls::before,.hm-char.cls::after{content:"";position:absolute;width:16px;height:16px;border:3px solid var(--cc);pointer-events:none}
.hm-char.cls::before{top:-2px;left:-2px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.hm-char.cls::after{bottom:-2px;right:-2px;border-left:0;border-top:0;border-radius:0 0 10px 0}
.hm-char.cls:hover,.hm-char.cls:focus-visible{border-color:var(--cc);transform:translateY(-1px);box-shadow:0 0 0 3px var(--surface) inset,0 0 0 4px var(--cc) inset,0 6px 18px color-mix(in srgb,var(--cd) 45%,transparent)}
.hm-char.cls .hm-n{color:color-mix(in srgb,var(--cc) 70%,var(--fg))}
.cls-emb{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:1.1rem;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--cc) 75%,#fff),var(--cd));border:2px solid color-mix(in srgb,var(--cc) 60%,#F2CF7E);box-shadow:0 2px 8px color-mix(in srgb,var(--cd) 50%,transparent)}
.cls-emb.big{position:static;width:58px;height:58px;font-size:1.8rem;flex:none}
.cls-banner{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:var(--r);color:#FFF4DE;border:2px solid var(--cc);
  background:radial-gradient(120% 160% at 0% 0%,color-mix(in srgb,var(--cc) 70%,transparent),transparent 60%),linear-gradient(135deg,var(--cd),color-mix(in srgb,var(--cd) 70%,#000));
  box-shadow:0 0 0 3px color-mix(in srgb,var(--cc) 25%,transparent),0 6px 20px color-mix(in srgb,var(--cd) 40%,transparent)}
.cls-bt{display:grid;gap:2px;min-width:0}
.cls-bt b{font:700 1.2rem/1.15 var(--f-deco);letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cls-bt small{font-size:.85rem;opacity:.9}
.cls-bt i{font-family:var(--f-num);font-size:.85rem;opacity:.8}
.cls-themed .card{border-top:3px solid var(--cc)}
.cls-themed h2{color:color-mix(in srgb,var(--cc) 65%,var(--fg))}
.cls-themed h2::before{color:var(--cc)}
.cls-themed .btn.pri{background:linear-gradient(color-mix(in srgb,var(--cc) 85%,#fff),var(--cd));border-color:var(--cc);color:#FFF4DE}
.cls-themed .prof.p1,.cls-themed .chip.on{background:var(--cc);border-color:var(--cc);color:#fff}
.epic{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;width:100%;padding:14px 18px;border-radius:14px;cursor:pointer;text-align:left;
  color:#FBE7B0;border:2px solid #D9A93E;
  background:radial-gradient(120% 140% at 0% 0%,#5B1420 0%,transparent 55%),radial-gradient(120% 140% at 100% 100%,#3A0E3E 0%,transparent 55%),linear-gradient(135deg,#1A0E0A,#2B1210 45%,#160A12);
  box-shadow:0 0 0 1px #6B4A12 inset,0 0 0 4px rgba(217,169,62,.18),0 6px 22px rgba(120,20,30,.45),0 0 28px rgba(217,169,62,.28);
  transition:transform .2s,box-shadow .2s;font:inherit}
.epic::before{content:"";position:absolute;inset:-40% -20%;background:linear-gradient(100deg,transparent 40%,rgba(255,226,150,.38) 50%,transparent 60%);transform:translateX(-70%);animation:epicShine 3.6s ease-in-out infinite}
.epic::after{content:"";position:absolute;inset:5px;border:1px solid rgba(217,169,62,.45);border-radius:9px;pointer-events:none}
.epic:hover,.epic:focus-visible{transform:translateY(-2px) scale(1.01);box-shadow:0 0 0 1px #6B4A12 inset,0 0 0 5px rgba(217,169,62,.3),0 10px 30px rgba(140,24,36,.55),0 0 42px rgba(255,200,90,.45)}
.epic:active{transform:scale(.98)}
.epic-crown{font-size:2rem;filter:drop-shadow(0 0 8px rgba(255,200,90,.85));animation:epicFloat 2.8s ease-in-out infinite;position:relative}
.epic-txt{display:grid;gap:2px;min-width:0;flex:1;position:relative}
.epic-txt b{font:700 1.2rem/1.1 var(--f-deco);letter-spacing:.04em;color:#FFE9A8;text-shadow:0 0 12px rgba(255,190,80,.55),0 2px 0 #3B0C10}
.epic-txt small{font-size:.8rem;color:#E6C989;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.epic-arrow{font-size:1.4rem;color:#FFD877;position:relative;transition:transform .2s}
.epic:hover .epic-arrow{transform:translateX(4px) rotate(-8deg)}
@keyframes epicShine{0%,55%{transform:translateX(-70%)}85%,100%{transform:translateX(70%)}}
@keyframes epicFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

/* derivati */
const mod=s=>Math.floor((Number(s)||0)/2)-5;
const pb=c=>Math.ceil((Number(c.level)||1)/4)+1;
const score=(c,a)=>(Number(c.ab[a])||0)+(Number((c.abTemp||{})[a])||0);
const amod=(c,a)=>mod(score(c,a));
const saveB=(c,a)=>amod(c,a)+(c.saves[a]?pb(c):0);
const skillB=(c,k,a)=>amod(c,a)+(c.skills[k]||0)*pb(c);
const initB=c=>amod(c,"DES")+(Number(c.initMisc)||0);
const spellDC=c=>8+pb(c)+amod(c,c.spellAbility);
const spellAtk=c=>pb(c)+amod(c,c.spellAbility);
const passive=(c,k,a)=>10+skillB(c,k,a);
const invWeight=c=>c.inv.reduce((s,i)=>s+(Number(i.weight)||0)*(Number(i.qty)||0),0);

let saveT=null,cloudT=null;
function touch(){const k=camp();if(k)k.updatedAt=Date.now();save()}
function save(){
  clearTimeout(saveT);saveT=setTimeout(()=>ls.set("ddf-state",JSON.stringify(S)),250);

let DB=null,COL=null,synced={},pendingDel=new Set(),chain=Promise.resolve();
async function initCloud(){
  if(!window.claude||!window.claude.use)return;
  try{
    const [user,db]=await Promise.all([claude.use("user"),claude.use("db")]);
    if(!user||!db){renderTop();return}
    const id=await user.id();if(!id)return;
    DB=db;COL=db.collection("data/users/"+id);
    UI.cloud="sincronizzo…";renderTop();
    const snap=await Promise.race([COL.get(),new Promise((_,r)=>setTimeout(()=>r(new Error("timeout")),10000))]);
    let meta=null;const remote={};
    for(const d of snap.docs){const v=d.data()||{};
      if(d.id==="meta")meta=v;
      else if(d.id.startsWith("camp_")&&typeof v.json==="string"){try{remote[d.id.slice(5)]=JSON.parse(v.json)}catch(e){}}}
    const order=meta&&Array.isArray(meta.order)?meta.order:Object.keys(remote);
    const merged=[];const seen=new Set();
    const localById=Object.fromEntries(S.campaigns.map(c=>[c.id,c]));
    const onlyDemoLocal=S.campaigns.length===1&&S.campaigns[0].__demo;
    for(const id of order){const r=remote[id];if(!r)continue;const l=localById[id];
      const pick=l&&(l.updatedAt||0)>(r.updatedAt||0)?l:r;merged.push(pick);seen.add(id);synced[id]=JSON.stringify(r)}
    for(const id in remote)if(!seen.has(id)){merged.push(remote[id]);seen.add(id);synced[id]=JSON.stringify(remote[id])}
    if(!(onlyDemoLocal&&merged.length))for(const l of S.campaigns)if(!seen.has(l.id))merged.push(l);
    if(merged.length){S.campaigns=merged;migrate();upgradeMySpells();if(meta&&meta.active&&merged.some(c=>c.id===meta.active))S.active=meta.active;if(!camp())S.active=merged[0].id}
    synced.__meta=meta?JSON.stringify({active:meta.active,order:meta.order}):"";
    UI.cloud="salvato nel tuo account";
    ls.set("ddf-state",JSON.stringify(S));render();pushCloud();
  }catch(e){DB=null;COL=null;UI.cloud="solo su questo dispositivo";renderTop()}
}
function pushCloud(){
  if(!COL)return;
  chain=chain.then(async()=>{
    try{
      let wrote=false;
      for(const id of [...pendingDel]){await COL.doc("camp_"+id).delete();pendingDel.delete(id);delete synced[id];wrote=true}
      for(const k of S.campaigns){const j=JSON.stringify(k);if(synced[k.id]!==j){
        if(j.length>250000){UI.cloud="campagna troppo grande per il cloud";continue}
        await COL.doc("camp_"+k.id).set({json:j,updatedAt:k.updatedAt||Date.now()});synced[k.id]=j;wrote=true}}
      const meta={active:S.active,order:S.campaigns.map(c=>c.id)};const mj=JSON.stringify(meta);
      if(synced.__meta!==mj){await COL.doc("meta").set(meta);synced.__meta=mj;wrote=true}
      if(wrote||UI.cloud!=="salvato nel tuo account"){UI.cloud="salvato nel tuo account";renderCloud()}
    }catch(e){UI.cloud="errore di salvataggio, riprovo";renderCloud();clearTimeout(cloudT);cloudT=setTimeout(pushCloud,8000)}
  });
}

const FBV="10.12.2";let FB=null,fbInit=null,pushT=null;const LIVE_SUBS={},fbSynced={};const pendingRemote=new Map();
const CLIENT=(()=>{let c=ls.get("ddf-client");if(!c){c=uid();ls.set("ddf-client",c)}return c})();
const fbEnabled=()=>!!(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.projectId&&!(window.claude&&window.claude.use));
const shareCode=k=>k&&k.share&&k.share.code;
function newCode(){const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";const r=new Uint32Array(16);crypto.getRandomValues(r);let s="";for(let i=0;i<16;i++){if(i&&i%4===0)s+="-";s+=A[r[i]%A.length]}return s}
const normCode=c=>String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"").replace(/(.{4})(?=.)/g,"$1-");
const LOCAL_KEYS=["share","__demo","activeChar","updatedAt","chars","id","master"];
function campCore(k){const o={...k};for(const x of LOCAL_KEYS)delete o[x];return JSON.stringify(o)}
function setShareStatus(t){UI.cloud=t;renderCloud()}
async function fbStart(){
  if(!fbEnabled())return null;if(fbInit)return fbInit;
  fbInit=(async()=>{
    const base=`https://www.gstatic.com/firebasejs/${FBV}/`;
    const [app,auth,fs]=await Promise.all([import(base+"firebase-app.js"),import(base+"firebase-auth.js"),import(base+"firebase-firestore.js")]);
    const a=app.initializeApp(window.FIREBASE_CONFIG);
    let db;try{db=fs.initializeFirestore(a,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})})}catch(e){db=fs.getFirestore(a)}
    const au=auth.getAuth(a);if(!au.currentUser)await auth.signInAnonymously(au);
    FB={fs,db};return FB})().catch(e=>{fbInit=null;setShareStatus("condivisione non raggiungibile, riprovo");setTimeout(()=>fbStart().then(()=>{listenAll();schedulePush()}),15000);throw e});
  return fbInit;
}
function campRef(code){return FB.fs.doc(FB.db,"campagne",code)}
function pgCol(code){return FB.fs.collection(FB.db,"campagne",code,"pg")}
function schedulePush(){clearTimeout(pushT);pushT=setTimeout(pushShared,900)}
function pushShared(){
  if(!FB)return;const {fs}=FB;
  for(const k of S.campaigns){const code=shareCode(k);if(!code)continue;const sy=fbSynced[code]||(fbSynced[code]={core:null,chars:{}});
    const core=campCore(k);if(sy.core!==core){sy.core=core;fs.setDoc(campRef(code),{json:core,updatedAt:Date.now(),by:CLIENT}).catch(shareErr)}
    const ids=new Set();
    for(const c of k.chars){ids.add(c.id);const j=JSON.stringify(c);if(sy.chars[c.id]!==j){sy.chars[c.id]=j;fs.setDoc(fs.doc(pgCol(code),c.id),{json:j,updatedAt:Date.now(),by:CLIENT}).catch(shareErr)}}
    for(const id in sy.chars)if(!ids.has(id)){delete sy.chars[id];fs.deleteDoc(fs.doc(pgCol(code),id)).catch(shareErr)}}
  if(S.campaigns.some(shareCode))setShareStatus(navigator.onLine===false?"offline: sincronizzo appena torna la rete":"condivisa online");
}
function shareErr(e){console.warn(e);setShareStatus("errore di condivisione: controlla la connessione")}
function typing(){const a=document.activeElement;return a&&(a.matches("input,textarea,select"))&&a.closest("#view,#modal")&&!a.closest("#modal .share-box")}
function applyRemote(code,kind,id,json){
  const k=S.campaigns.find(x=>shareCode(x)===code);if(!k)return;const sy=fbSynced[code]||(fbSynced[code]={core:null,chars:{}});
  if(kind==="core"){if(sy.core===json)return;let o;try{o=JSON.parse(json)}catch(e){return}sy.core=json;
    for(const key in o)if(!LOCAL_KEYS.includes(key))k[key]=o[key];}
  else if(kind==="char"){if(json===null){if(!(id in sy.chars)&&!k.chars.some(c=>c.id===id))return;delete sy.chars[id];k.chars=k.chars.filter(c=>c.id!==id);if(k.activeChar===id)k.activeChar=k.chars[0]?k.chars[0].id:null}
    else{if(sy.chars[id]===json)return;let c;try{c=JSON.parse(json)}catch(e){return}sy.chars[id]=json;const i=k.chars.findIndex(x=>x.id===id);if(i>=0)k.chars[i]=c;else{k.chars.push(c);if(!k.activeChar)k.activeChar=c.id}}}
  migrate();ls.set("ddf-state",JSON.stringify(S));
  if(k===camp()){if(typing())UI.remoteDirty=true;else render()}
}
document.addEventListener("focusout",()=>setTimeout(()=>{if(UI.remoteDirty&&!typing()){UI.remoteDirty=false;render()}},300));
function listen(code){
  if(!FB||LIVE_SUBS[code])return;const {fs}=FB;
  const u1=fs.onSnapshot(campRef(code),d=>{if(d.exists()&&d.data().json)applyRemote(code,"core",null,d.data().json)},shareErr);
  const u2=fs.onSnapshot(pgCol(code),q=>{q.docChanges().forEach(ch=>{if(ch.type==="removed")applyRemote(code,"char",ch.doc.id,null);else applyRemote(code,"char",ch.doc.id,ch.doc.data().json)})},shareErr);
  LIVE_SUBS[code]=()=>{u1();u2()};
}
function listenAll(){for(const k of S.campaigns){const c=shareCode(k);if(c)listen(c)}}

async function joinCode(raw){

    k.activeChar=k.chars[0]?k.chars[0].id:null;
    if(S.campaigns.length===1&&S.campaigns[0].__demo)S.campaigns=[];
    S.campaigns.push(k);S.active=k.id;migrate();upgradeMySpells();ls.set("ddf-state",JSON.stringify(S));listen(code);closeModal();render();

function migrate(){ // completa campi mancanti dopo aggiornamenti

/* ============ binding ============ */
function resolve(path){
  const segs=path.split(".");let o=segs[0]==="c"?ch():segs[0]==="k"?camp():null;
  for(let i=1;i<segs.length-1;i++){o=step(o,segs[i]);if(o==null)return[null]}
  return[o,segs[segs.length-1]];
}
function step(o,seg){if(o==null)return null;const h=seg.indexOf("#");if(h<0)return o[seg];const arr=o[seg.slice(0,h)];return Array.isArray(arr)?arr.find(x=>x.id===seg.slice(h+1)):null}
function getv(path){const[o,k]=resolve(path);return o?o[k]:undefined}
function setv(path,v){const[o,k]=resolve(path);if(o)o[k]=v}
const fid=p=>"f-"+p.replace(/[^a-zA-Z0-9]/g,"_");
function inp(path,opt={}){
  const v=getv(path);const t=opt.type||(typeof v==="number"?"number":"text");
  if(t==="checkbox")return `<input type="checkbox" id="${fid(path)}" data-b="${path}" ${v?"checked":""} ${opt.attrs||""}>`;
  return `<input type="${t}" id="${fid(path)}" data-b="${path}" ${t==="number"?'inputmode="numeric" data-n="1"':""} value="${esc(v??"")}" placeholder="${esc(opt.ph||"")}" ${opt.attrs||""}>`;
}
function ta(path,ph="",rows=4){return `<textarea id="${fid(path)}" data-b="${path}" rows="${rows}" placeholder="${esc(ph)}">${esc(getv(path)??"")}</textarea>`}
function sel(path,options,opt={}){const v=getv(path);return `<select id="${fid(path)}" data-b="${path}" ${opt.num?'data-n="1"':""}>${options.map(o=>{const[val,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(val)===String(v)?"selected":""}>${esc(l)}</option>`}).join("")}</select>`}
const fld=(label,html,cls="")=>`<label class="f ${cls}"><span class="lbl">${label}</span>${html}</label>`;

document.addEventListener("input",e=>{
  const el=e.target;if(!el.dataset||!el.dataset.b)return;
  let v=el.type==="checkbox"?el.checked:el.value;
  if(el.dataset.n!==undefined&&el.type!=="checkbox"){v=v===""?0:Number(v);if(Number.isNaN(v))return}
  setv(el.dataset.b,v);touch();refreshLive();
  if(el.tagName==="SELECT"||el.type==="checkbox")render();
});

const LIVE={
  mod:a=>{const c=ch();return sgn(amod(c,a))},
  pb:()=>sgn(pb(ch())),

/* ============ dadi ============ */
const rnd=n=>1+Math.floor(Math.random()*n);
function parseRoll(expr){
  const s=String(expr||"").replace(/\s+/g,"").toLowerCase().replace(/^\+/,"");
  if(!s)return null;
  const re=/([+-]?)(?:(\d*)d(\d+)|(\d+))/gy;let m,total=0,parts=[],pos=0,dice=[];
  while(pos<s.length){re.lastIndex=pos;m=re.exec(s);if(!m||m[0]==="")return null;pos=re.lastIndex;
    const sign=m[1]==="-"?-1:1;
    if(m[3]){const n=Math.min(Number(m[2]||1),100),f=Number(m[3]);if(!f)return null;const r=[];for(let i=0;i<n;i++)r.push(rnd(f));const sum=r.reduce((a,b)=>a+b,0);total+=sign*sum;parts.push(`${sign<0?"−":parts.length?"+":""}${n}d${f}[${r.join(",")}]`);dice.push({f,r})}
    else{total+=sign*Number(m[4]);parts.push(`${sign<0?"−":parts.length?"+":""}${m[4]}`)}}
  return{total,detail:parts.join(" "),dice};
}
function roll(label,expr){
  const r=parseRoll(expr);if(!r){toast(`<div>Formula non valida: ${esc(expr)}</div><div class="muted">Esempi: 1d20+5, 2d6+3, 4d6</div>`);return}
  pushHist(label||expr,r.total,r.detail);toast(`<div>${esc(label||expr)}</div><div class="big">${r.total}</div><div style="font-size:.8rem;opacity:.8">${esc(r.detail)}</div>`);
}
function d20(label,bonus){
  const mode=UI.diceMode;const a=rnd(20),b=rnd(20);
  const k=mode==="adv"?Math.max(a,b):mode==="dis"?Math.min(a,b):a;
  const total=k+bonus;const pair=mode==="norm"?`${a}`:`${a}, ${b} → ${k}`;
  const cls=k===20?"crit":k===1?"fumble":"";const note=k===20?"20 naturale!":k===1?"1 naturale":"";
  const m=mode==="adv"?" (vantaggio)":mode==="dis"?" (svantaggio)":"";
  pushHist(label+m,total,`d20[${pair}] ${sgn(bonus)}`);
  toast(`<div>${esc(label)}${m}</div><div class="big ${cls}">${total}</div><div style="font-size:.8rem;opacity:.8">d20 [${pair}] ${sgn(bonus)} ${note?`· <b class="${cls}">${note}</b>`:""}</div>`);
  if(mode!=="norm"){UI.diceMode="norm";if(UI.drawer)renderDrawer()}
  return total;
}
function pushHist(label,total,detail){UI.hist.unshift({label,total,detail,t:new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})});UI.hist=UI.hist.slice(0,40);if(UI.drawer)renderDrawer()}

function damage(c,n){n=Math.max(0,Math.floor(n));if(!n)return;
  const t=Math.min(c.hp.temp,n);c.hp.temp-=t;n-=t;const before=c.hp.cur;c.hp.cur=Math.max(0,c.hp.cur-n);
  if(c.concentration&&t+n>0){const dc=Math.max(10,Math.floor((t+n)/2));toast(`<div>${esc(c.name)} subisce ${t+n} danni</div><div>Concentrazione su <b>${esc(c.concentration)}</b>: TS COS CD ${dc}</div>`,5000)}
  if(before>0&&c.hp.cur===0)toast(`<div><b>${esc(c.name)}</b> è a 0 PF!</div><div>Tiri salvezza contro morte attivi.</div>`,5000);
}
function heal(c,n){n=Math.max(0,Math.floor(n));if(!n)return;if(c.hp.cur===0)c.death={s:0,f:0};c.hp.cur=Math.min(c.hp.max,c.hp.cur+n)}

/* ============ compendio incantesimi (SRD 5.1) ============ */
let SPELLDB=null,spellErr=false;
const TR=(()=>{try{return JSON.parse(ls.get("ddf-tr")||"{}")}catch(e){return{}}})();
function upgradeMySpells(){if(!SPELLDB)return;const by=Object.fromEntries(SPELLDB.map(o=>[o.i,o]));let n=0;for(const k of S.campaigns)for(const c of k.chars)for(const s of c.spells){const o=s.srd&&by[s.srd];if(!o||!o.it)continue;if(!s.tr){s.tr=true;s.name=o.n;s.desc=o.x;s.higher=o.h||"";s.material=o.m||"";n++}if(!s.brief){s.brief=o.b;n++}}if(n){S.campaigns.forEach(k=>k.updatedAt=Date.now());save()}}
function loadSpells(){if(SPELLDB||loadSpells.p)return;loadSpells.p=fetch("spells.json").then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{SPELL_SRD=d;SPELLDB=packSpells(d);upgradeMySpells();if(UI.tab==="magie")renderView();const r=document.getElementById("mcmd-res");if(r&&UI.mq)r.innerHTML=cmdResults(UI.mq)}).catch(()=>{spellErr=true;loadSpells.p=null;if(UI.tab==="magie")renderView()})}
const CLASSES=["Bardo","Chierico","Druido","Mago","Paladino","Ranger","Stregone","Warlock"];
function guessClass(cls){const s=(cls||"").toLowerCase();return CLASSES.find(k=>s.includes(k.toLowerCase()))||""}
function dbView(o){const t=o.it?{}:(TR[o.i]||{});return{brief:o.b||"",name:t.n||o.n,orig:o.en||(t.n?o.n:""),level:o.l,school:o.s,time:o.t,range:o.r,comp:o.c,material:o.m||"",duration:o.d,conc:!!o.k,ritual:!!o.ri,classes:o.cls,desc:t.x||o.x,higher:t.h||o.h||"",dmg:o.dm||"",ts:o.ts||"",dt:o.dt||"",srd:o.i,translated:!!(o.it||t.x)}}
function mySpellView(s){return{brief:s.brief||"",name:s.name,level:s.level,school:s.school,time:s.time,range:s.range,comp:s.comp,material:s.material||"",duration:s.duration,conc:s.conc,ritual:s.ritual,classes:s.classes||[],desc:s.desc,higher:s.higher||"",dmg:s.dmg,ts:s.ts||"",srd:s.srd,translated:!!s.tr}}
const TS_IT={STR:"Forza",DEX:"Destrezza",CON:"Costituzione",INT:"Intelligenza",WIS:"Saggezza",CHA:"Carisma"};
function para(t){return String(t||"").split(/\n{2,}/).map(p=>`<p style="margin:0">${esc(p).replace(/\n/g,"<br>")}</p>`).join("")}
function spellCard(v,opt={}){
  const lv=Number(v.level)===0?`Trucchetto di ${(v.school||"").toLowerCase()}`:`${v.school||"Incantesimo"} di ${v.level}° livello`;
  const row=(k,val)=>val?`<div><span class="lbl">${k}</span><div>${esc(val)}</div></div>`:"";
  return `<div class="spellcard">${v.brief&&!opt.noBrief?`<div class="sp-brief">${esc(v.brief)}</div>`:""}<div class="muted" style="font-style:italic">${esc(lv)}${v.ritual?" (rituale)":""}${v.orig?` · ${esc(v.orig)}`:""}</div>
    <div class="sp-grid">${row("Tempo di lancio",v.time)}${row("Gittata",v.range)}${row("Componenti",v.comp+(v.material?` (${v.material})`:""))}${row("Durata",(v.conc?"Concentrazione, ":"")+(v.duration||""))}
    ${v.ts?row("Tiro salvezza",TS_IT[v.ts]||v.ts):""}${v.dmg?row("Danni / cura",v.dmg+(v.dt?` ${v.dt}`:"")):""}${v.classes&&v.classes.length?row("Classi",v.classes.join(", ")):""}</div>
    <div class="sp-desc">${para(v.desc)||`<span class="muted">Nessuna descrizione.</span>`}${v.higher?`<p style="margin:0"><b>Ai livelli superiori.</b> ${esc(v.higher)}</p>`:""}</div>
    ${v.srd&&!v.translated&&SAMPLE!==false?`<div><button class="btn sm" data-a="sp-tr" data-i="${esc(v.srd)}" ${opt.trMine?`data-mine="${opt.trMine}"`:""}>Traduci in italiano</button></div>`:""}</div>`;
}
function compFiltered(){const f=UI.comp;const q=f.q.trim().toLowerCase();
  return SPELLDB.filter(o=>(f.lvl===""||o.l===Number(f.lvl))&&(!f.cls||o.cls.includes(f.cls))&&(!f.sch||o.s===f.sch)&&(!f.conc||o.k)&&(!f.rit||o.ri)&&(!q||o.n.toLowerCase().includes(q)||(o.en||"").toLowerCase().includes(q)||((TR[o.i]||{}).n||"").toLowerCase().includes(q)))}
function vCompendio(){
  const c=UI.tab==="libro"?null:ch();if(UI.comp.cls===null&&c)UI.comp.cls=guessClass(c.cls);
  if(!SPELLDB){loadSpells();return `<section class="card"><h2>Compendio incantesimi</h2><div class="empty">${spellErr?"Non riesco a caricare l'elenco degli incantesimi. Riprova più tardi.":"Carico 319 incantesimi…"}</div></section>`}
  const f=UI.comp;
  return `<section class="card">
    <div class="card-h"><h2>Compendio incantesimi</h2><span class="muted" style="font-size:.8rem">${SPELL_SRD?SPELL_SRD.length:319} incantesimi del Regolamento base (SRD 5.1)${SPELLDB&&SPELL_SRD&&SPELLDB.length>SPELL_SRD.length?` + ${SPELLDB.length-SPELL_SRD.length} dai tuoi manuali`:""}</span></div>
    <div class="fields">

      <label class="f"><span class="lbl">Scuola</span><select id="comp-sch"><option value="">Tutte</option>${SCHOOLS.filter(Boolean).map(k=>`<option ${k===f.sch?"selected":""}>${k}</option>`).join("")}</select></label>
    </div>
    <div class="row"><label class="row" style="gap:6px;font-size:.85rem"><input type="checkbox" id="comp-conc" ${f.conc?"checked":""}> Concentrazione</label><label class="row" style="gap:6px;font-size:.85rem"><input type="checkbox" id="comp-rit" ${f.rit?"checked":""}> Rituale</label></div>
    <div id="comp-results">${compResults()}</div>
    <p class="muted" style="margin:0;font-size:.72rem">Contiene materiale tratto dal System Reference Document 5.1 di Wizards of the Coast LLC, con licenza CC-BY-4.0, tradotto in italiano. Distanze convertite in metri.</p>
  </section>`;
}
function compResults(){
  const c=UI.tab==="libro"?null:ch();const list=compFiltered();const shown=list.slice(0,UI.comp.limit);const mine=new Set(c?c.spells.map(s=>s.srd).filter(Boolean):[]);
  return `<div class="list">${shown.map(o=>{const v=dbView(o);const id="cp-"+o.i;return `<details class="it" data-id="${id}" ${isOpen(id)}><summary>
      <span class="tag num">${o.l===0?"T":o.l+"°"}</span><span class="t tt"><span>${esc(v.name)}</span>${v.brief||o.fo?`<small>${o.fo?"📦 "+esc(o.fo)+(v.brief?" · ":""):""}${esc(v.brief||"")}</small>`:""}</span>${o.k?`<span class="tag gold">C</span>`:""}${o.ri?`<span class="tag">R</span>`:""}
      ${!c?"":mine.has(o.i)?`<span class="tag acc">✓ nel libro</span>`:`<button class="btn sm" data-a="sp-learn" data-i="${o.i}">Aggiungi</button>`}</summary>
    <div class="body">${spellCard(v,{noBrief:1})}</div></details>`}).join("")||`<div class="empty">Nessun incantesimo con questi filtri.</div>`}</div>
    ${list.length>shown.length?`<div style="margin-top:8px"><button class="btn sm" data-a="comp-more">Mostra altri (${list.length-shown.length})</button></div>`:`<div class="muted" style="font-size:.8rem;margin-top:6px">${list.length} incantesimi</div>`}`;
}
function rerenderComp(){const el=$("#comp-results");if(!el)return;el.innerHTML=compResults();el.querySelectorAll("details[data-id]").forEach(d=>d.addEventListener("toggle",()=>{d.open?UI.open.add(d.dataset.id):UI.open.delete(d.dataset.id)}))}
const COMP_IDS={"comp-q":"q","comp-cls":"cls","comp-lvl":"lvl","comp-sch":"sch","comp-conc":"conc","comp-rit":"rit"};
document.addEventListener("input",e=>{const k=COMP_IDS[e.target.id];if(!k)return;UI.comp[k]=e.target.type==="checkbox"?e.target.checked:e.target.value;UI.comp.limit=50;rerenderComp()});
let SAMPLE=(window.claude&&window.claude.use)?null:false;

function slotsLeft(c){const out=[];for(let i=1;i<=9;i++){const s=c.slots[i];if(s&&Number(s.max)>0)out.push(`${i}°: ${Math.max(0,s.max-s.used)}/${s.max}`)}return out}
function vParty(){

      <div style="min-width:0"><h3>${esc(c.name)}</h3>
        <div class="muted" style="font-size:.82rem">${esc([c.race,[c.cls,c.subclass].filter(Boolean).join(" · "),"liv. "+c.level].filter(Boolean).join(" · "))}${c.player?` — <b>${esc(c.player)}</b>`:""}</div></div>
      <div class="hpbar" style="min-width:0;flex:none"><i style="width:${p}%;background:${hpColor(p)}"></i><span>${c.hp.cur}/${c.hp.max}${c.hp.temp?` +${c.hp.temp}`:""} PF</span></div>
      <div class="dmg"><input type="number" inputmode="numeric" id="md-${c.id}" placeholder="PF" aria-label="Quantità"><button class="btn sm" data-a="ms-dmg" data-id="${c.id}">Danno</button><button class="btn sm" data-a="ms-heal" data-id="${c.id}">Cura</button></div>
      <div class="mstats">
        <div><b>${esc(c.ac)}</b><small>CA</small></div>
        <div><b>${sgn(initB(c))}</b><small>Iniz.</small></div>
        <div><b>${esc(c.speed||"—")}</b><small>Velocità</small></div>
        <div><b>${caster?spellDC(c):"—"}</b><small>CD inc.</small></div>
        <div><b>${passive(c,"percezione","SAG")}</b><small>Perc. pass.</small></div>
        <div><b>${passive(c,"intuizione","SAG")}</b><small>Intuiz. pass.</small></div>

      <div class="msaves">${AB.map(a=>`<span class="${c.saves[a]?"pr":""}" title="Tiro salvezza ${AB_FULL[a]}">${a}<br><b>${sgn(saveB(c,a))}</b></span>`).join("")}</div>
      ${sl.length?`<div style="font-size:.8rem"><span class="muted">Slot incantesimo:</span> ${sl.join(" · ")}</div>`:""}
      ${tags?`<div class="chips">${tags}</div>`:""}
      ${c.languages?`<div class="muted" style="font-size:.78rem">Lingue: ${esc(c.languages)}</div>`:""}
      <div class="row" style="justify-content:space-between;align-items:center"><span class="muted" style="font-size:.72rem">${c.importedAt?"Ricevuta il "+new Date(c.importedAt).toLocaleString("it-IT",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"Creata qui"}</span>
        <span class="row" style="gap:4px"><button class="btn sm" data-a="ms-open" data-id="${c.id}">Apri scheda</button><button class="btn sm ghost" data-a="ms-del" data-id="${c.id}" aria-label="Rimuovi ${esc(c.name)}">✕</button></span></div>
    </div>`}).join("");
  return `<section class="card">
    <div class="card-h"><h2>Tavolo del Master</h2><div class="row"><button class="btn pri sm" data-a="ms-import">Importa schede giocatori</button><button class="btn sm" data-a="cmb-party" ${L.length?"":"disabled"}>Tira iniziativa per tutti</button></div></div>
    ${codeBox(k)}<p class="muted" style="margin:0;font-size:.85rem">Ogni giocatore apre il Taccuino sul suo telefono e usa <b>☰ → Invia scheda al Master</b>. Tu importi il file qui: se la scheda c'è già viene aggiornata. Per avere i dati aggiornati, fatti rimandare la scheda.</p>

/* ============ dati del Master: regole, bestiario base, generatore di ambienti ============ */
const RULES=[
{t:"Vantaggio e svantaggio",k:"vantaggio svantaggio tiro due d20",x:"Con vantaggio tiri due d20 e tieni il più alto; con svantaggio tieni il più basso. Se hai sia vantaggio sia svantaggio si annullano, anche se le fonti sono più d'una per lato. Ritiri (es. Fortunato) si applicano a uno solo dei dadi."},
{t:"Prova di caratteristica",k:"prova abilità cd difficoltà check",x:"d20 + modificatore di caratteristica (+ competenza se competente nell'abilità) contro una CD. CD indicative: molto facile 5, facile 10, media 15, difficile 20, molto difficile 25, quasi impossibile 30."},
{t:"Prove contrapposte",k:"contesa contrapposta confronto",x:"Entrambi tirano la prova indicata; vince il risultato più alto. In caso di pareggio la situazione resta com'era (chi tentava di cambiare le cose non ci riesce)."},
{t:"Aiutare",k:"aiuto aiutare assistere azione",x:"Come azione dai a un alleato vantaggio alla sua prossima prova per un compito in cui puoi aiutare, oppure al suo prossimo attacco contro una creatura entro 1,5 m da te, purché avvenga prima dell'inizio del tuo turno successivo."},
{t:"Prove di gruppo",k:"gruppo prova collettiva",x:"Ognuno tira; se almeno metà del gruppo supera la CD, il gruppo riesce. Utile per muoversi furtivi, orientarsi o arrampicarsi insieme."},
{t:"Percezione passiva",k:"passiva percezione nascosto notare",x:"10 + tutti i modificatori della prova (Saggezza + competenza in Percezione). Vantaggio +5, svantaggio −5. Si confronta con le prove di Furtività di chi si nasconde."},
{t:"Sorpresa",k:"sorpresa sorpreso imboscata",x:"Il DM confronta la Furtività di chi si nasconde con la Percezione passiva degli avversari. Chi non nota la minaccia è sorpreso: nel primo turno non può muoversi né agire e non può usare reazioni finché quel turno non termina."},
{t:"Iniziativa e turno",k:"iniziativa turno round ordine",x:"All'inizio del combattimento ognuno tira d20 + Destrezza. Un round dura 6 secondi. Nel tuo turno puoi muoverti fino alla tua velocità e compiere un'azione; puoi avere anche un'azione bonus (se un privilegio te la concede), una reazione per round e una interazione gratuita con un oggetto."},
{t:"Azioni in combattimento",k:"azioni attacco scatto disimpegno schivata nascondersi preparare cercare usare oggetto lanciare incantesimo",x:"Attacco; Lanciare un incantesimo; Scatto (movimento extra pari alla velocità); Disimpegno (il tuo movimento non provoca attacchi di opportunità); Schivata (attacchi contro di te con svantaggio, TS su Destrezza con vantaggio); Aiuto; Nascondersi; Preparare (scegli un innesco e una reazione); Cercare; Usare un oggetto."},
{t:"Preparare un'azione",k:"preparare azione preparata innesco reazione",x:"Decidi un innesco percepibile e l'azione da fare; quando avviene, usi la reazione per eseguirla (o ignori l'innesco). Un incantesimo preparato va lanciato subito, tenuto con concentrazione e rilasciato con la reazione: se la concentrazione si rompe, l'incantesimo è perso."},
{t:"Attacco di opportunità",k:"opportunità attacco reazione allontanarsi portata",x:"Quando una creatura ostile che puoi vedere esce dalla tua portata, puoi usare la reazione per un attacco in mischia contro di lei. Non lo provoca chi usa Disimpegno, chi viene teletrasportato o chi viene spostato senza usare movimento, azione o reazione."},
{t:"Tiro per colpire",k:"attacco tiro colpire ca bonus",x:"d20 + modificatore (Forza in mischia, Destrezza a distanza, accurata a scelta) + competenza se competente con l'arma. Se il totale è pari o superiore alla CA del bersaglio, colpisci. 20 naturale colpisce sempre; 1 naturale manca sempre."},
{t:"Colpo critico",k:"critico 20 naturale danni doppi",x:"Con un 20 naturale l'attacco è un critico: tira due volte tutti i dadi di danno dell'attacco (anche quelli extra, come Attacco furtivo o Punizione) e aggiungi i modificatori una volta sola."},
{t:"Attacchi a distanza",k:"distanza gittata lunga mischia vicino arco",x:"Oltre la gittata normale e fino a quella lunga hai svantaggio; oltre la lunga non puoi attaccare. Hai svantaggio anche se una creatura ostile, che non è incapacitata e ti vede, è entro 1,5 m da te."},
{t:"Combattere con due armi",k:"due armi leggera mano secondaria",x:"Quando attacchi con un'arma leggera in mischia, puoi usare l'azione bonus per attaccare con un'altra arma leggera nell'altra mano. Al danno del secondo attacco non aggiungi il modificatore di caratteristica, a meno che sia negativo."},
{t:"Lottare (afferrare)",k:"lotta afferrare afferrato presa",x:"Al posto di uno dei tuoi attacchi: prova di Forza (Atletica) contro Forza (Atletica) o Destrezza (Acrobazia) del bersaglio, che non può essere più di una taglia più grande di te. Se vinci è afferrato (velocità 0). Per liberarsi usa un'azione e ripete la contesa. Puoi trascinarlo a metà velocità."},
{t:"Spingere",k:"spingere spinta prono buttare a terra",x:"Al posto di uno dei tuoi attacchi: Forza (Atletica) contro Forza (Atletica) o Destrezza (Acrobazia). Se vinci lo butti prono o lo spingi di 1,5 m. Il bersaglio non può essere più di una taglia più grande di te."},
{t:"Copertura",k:"copertura riparo muro mezza tre quarti totale",x:"Mezza copertura: +2 a CA e TS su Destrezza. Tre quarti: +5. Copertura totale: non puoi essere bersagliato direttamente da attacchi o incantesimi."},
{t:"Bersagli invisibili e nascosti",k:"invisibile nascosto non visto cieco attaccare",x:"Attaccare una creatura che non puoi vedere: svantaggio. Se lei non può vedere te: hai vantaggio contro di lei. Se sei nascosto e attacchi, riveli la tua posizione, colpisca o manchi l'attacco."},
{t:"Nascondersi",k:"nascondersi furtività nascosto",x:"Azione Nascondersi: prova di Destrezza (Furtività) contro la Percezione passiva (o attiva) di chi ti cerca. Non puoi nasconderti da chi ti vede chiaramente. Resti nascosto finché non vieni scoperto o fai rumore o attacchi."},
{t:"Movimento e terreno difficile",k:"movimento terreno difficile strisciare scalare nuotare",x:"Nel terreno difficile ogni metro costa doppio. Scalare, nuotare e strisciare costano un metro extra per metro (salvo velocità specifiche). Puoi dividere il movimento prima e dopo l'azione. Puoi attraversare lo spazio di un alleato, non quello di un nemico (a meno che sia di due taglie diverse)."},
{t:"Salto",k:"saltare salto lungo alto",x:"Salto in lungo con rincorsa (3 m): tanti piedi quanto il punteggio di Forza (circa 30 cm per punto); da fermo la metà. Salto in alto con rincorsa: 3 + modificatore di Forza piedi (circa 90 cm + 30 cm per punto); da fermo la metà."},
{t:"Prono",k:"prono a terra rialzarsi",x:"Puoi muoverti solo strisciando. Hai svantaggio ai tiri per colpire. Gli attacchi contro di te hanno vantaggio se l'attaccante è entro 1,5 m, altrimenti svantaggio. Rialzarsi costa metà della velocità."},
{t:"Danni e resistenze",k:"resistenza vulnerabilità immunità danni tipo",x:"Resistenza dimezza i danni di quel tipo, vulnerabilità li raddoppia, immunità li annulla. Si applicano dopo gli altri modificatori. Più resistenze allo stesso tipo contano come una."},
{t:"Punti ferita temporanei",k:"pf temporanei temporanei",x:"Si perdono per primi e non si sommano tra loro: se ne ricevi di nuovi scegli se tenere i vecchi o i nuovi. Non sono cure e non riportano su da 0 PF. Durano fino a un riposo lungo salvo diversa indicazione."},
{t:"Scendere a 0 PF e morte immediata",k:"0 pf zero morte morire privo di sensi massiccio",x:"A 0 PF cadi privo di sensi. Se i danni residui dopo averti portato a 0 sono pari o superiori ai tuoi PF massimi, muori sul colpo. I mostri di solito muoiono a 0 PF, a scelta del DM."},
{t:"Tiri salvezza contro morte",k:"tiro salvezza morte stabilizzare morente",x:"A 0 PF, all'inizio di ogni tuo turno tira d20: 10 o più è un successo, sotto 10 un fallimento. 3 successi: sei stabile. 3 fallimenti: muori. 20 naturale: torni a 1 PF. 1 naturale: due fallimenti. Subire danni a 0 PF è un fallimento (un critico ne vale due)."},
{t:"Stabilizzare",k:"stabilizzare medicina kit guaritore",x:"Azione: prova di Saggezza (Medicina) CD 10 su una creatura morente, o usare un kit del guaritore. Una creatura stabile resta a 0 PF ma non tira più salvezza contro morte; recupera 1 PF dopo 1d4 ore."},
{t:"Concentrazione",k:"concentrazione incantesimo rompere ts costituzione",x:"Puoi concentrarti su un solo incantesimo alla volta. Quando subisci danni fai un TS su Costituzione con CD 10 o metà dei danni (il più alto); se fallisci perdi l'incantesimo. Si rompe anche se sei incapacitato o muori."},
{t:"Lanciare incantesimi",k:"incantesimi componenti verbale somatica materiale slot",x:"V: parlare. S: almeno una mano libera. M: componente o focus (quelle con costo indicato vanno possedute; se consumate si perdono). Gli slot si spendono al livello scelto (pari o superiore). Se lanci un incantesimo come azione bonus, nel turno puoi lanciare solo trucchetti con l'azione."},
{t:"Rituali",k:"rituale rituali 10 minuti",x:"Un incantesimo con l'etichetta rituale può essere lanciato in 10 minuti in più senza spendere slot, se la tua classe permette di lanciare rituali."},
{t:"CD e attacco degli incantesimi",k:"cd incantesimo tiro salvezza attacco incantesimo",x:"CD = 8 + competenza + modificatore della caratteristica da incantatore. Tiro per colpire con incantesimo = competenza + modificatore della caratteristica da incantatore."},
{t:"Riposo breve",k:"riposo breve dadi vita",x:"Almeno 1 ora di attività leggera. Puoi spendere Dadi Vita: per ognuno tira il dado + modificatore di Costituzione e recuperi quei PF. Alcuni privilegi si ricaricano."},
{t:"Riposo lungo",k:"riposo lungo dormire 8 ore",x:"Almeno 8 ore, di cui al massimo 2 di attività leggera. Recuperi tutti i PF e metà dei Dadi Vita totali (minimo 1). Esaurimento −1 se hai mangiato e bevuto. Un solo riposo lungo ogni 24 ore."},
{t:"Esaurimento",k:"esaurimento fatica livelli",x:"1: svantaggio alle prove di caratteristica. 2: velocità dimezzata. 3: svantaggio a tiri per colpire e TS. 4: PF massimi dimezzati. 5: velocità 0. 6: morte. Gli effetti si sommano; un riposo lungo con cibo e acqua toglie un livello."},
{t:"Accecato",k:"accecato cieco condizione",x:"Non vede e fallisce le prove che richiedono la vista. I suoi attacchi hanno svantaggio; gli attacchi contro di lui hanno vantaggio."},
{t:"Affascinato",k:"affascinato charme condizione",x:"Non può attaccare né bersagliare con effetti dannosi chi lo ha affascinato. Chi lo ha affascinato ha vantaggio alle prove per interagire socialmente con lui."},
{t:"Afferrato",k:"afferrato lotta condizione",x:"Velocità 0. Termina se chi afferra è incapacitato o se un effetto li allontana fuori portata."},

{t:"Invisibile",k:"invisibile condizione",x:"Non può essere visto senza magia o sensi speciali; ai fini del nascondersi è pesantemente oscurato. I suoi attacchi hanno vantaggio, quelli contro di lui svantaggio."},
{t:"Paralizzato",k:"paralizzato condizione",x:"Incapacitato, non si muove né parla. Fallisce i TS su Forza e Destrezza. Attacchi contro di lui con vantaggio; ogni colpo da entro 1,5 m è critico."},
{t:"Pietrificato",k:"pietrificato pietra condizione",x:"Trasformato in sostanza inanimata, peso ×10, non invecchia. Incapacitato, non si muove né parla, non percepisce. Attacchi contro di lui con vantaggio; fallisce TS su Forza e Destrezza; resistenza a tutti i danni; immune a veleno e malattie (sospesi)."},

/* ---- manuali personali del Master: importati da file, restano solo su questo dispositivo (IndexedDB), mai sincronizzati né pubblicati ---- */
let PACKS=[],MON_SRD=null,SPELL_SRD=null,PACKRULES=[];
function packDB(){return new Promise((res,rej)=>{try{const r=indexedDB.open("ddf-packs",1);r.onupgradeneeded=()=>r.result.createObjectStore("packs",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
function packTx(mode,fn){return packDB().then(db=>new Promise((res,rej)=>{const t=db.transaction("packs",mode);const st=t.objectStore("packs");const q=fn(st);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}))}
const packMons=d=>d.concat(...PACKS.map(p=>(p.monsters||[]).map(o=>({...o,fo:p.name}))));
const packSpells=d=>d.concat(...PACKS.map(p=>(p.spells||[]).map(o=>({...o,fo:p.name}))));
function packsApply(){memCheck();PACKRULES=[].concat(...PACKS.map(p=>(p.rules||[]).map(r=>({...r,fo:p.name}))));if(MON_SRD)MONDB=packMons(MON_SRD);if(SPELL_SRD)SPELLDB=packSpells(SPELL_SRD);refreshMonLists();if(["home","libro","bestiario","master"].includes(UI.tab))renderView()}
const unBundle=d=>d&&d.kind==="ddf-bundle"&&Array.isArray(d.packs)?d.packs.filter(isPack):isPack(d)?[d]:[];
async function packsBuiltin(){if(!(window.claude&&window.claude.use))return [];try{const r=await fetch("manuali.json");if(!r.ok)return [];return unBundle(await r.json()).map(p=>({...p,builtin:true}))}catch(e){return []}}
async function packsLoad(){let L=[];try{L=await packTx("readonly",st=>st.getAll())||[]}catch(e){}
  const B=await packsBuiltin();const ids=new Set(L.map(p=>p.id));PACKS=L.concat(B.filter(p=>!ids.has(p.id))).sort((a,b)=>(a.name||"").localeCompare(b.name||""));if(PACKS.length)packsApply()}
const isPack=d=>d&&d.kind==="ddf-pack"&&d.id&&(Array.isArray(d.monsters)||Array.isArray(d.spells)||Array.isArray(d.rules));
async function importPacks(list){let n=0;for(const d of list){const p={id:String(d.id),name:String(d.name||d.id),monsters:d.monsters||[],spells:d.spells||[],rules:Array.isArray(d.rules)?d.rules:[],importedAt:Date.now()};try{await packTx("readwrite",st=>st.put(p));PACKS=PACKS.filter(x=>x.id!==p.id).concat(p);n++}catch(e){toast("Non riesco a salvare il manuale su questo dispositivo (spazio pieno?).");return}}
  if(n){packsApply();const p=list[list.length-1];toast(n>1?`Importati ${n} manuali: <b>${list.map(x=>esc(x.name||x.id)).join(", ")}</b>. Restano solo su questo dispositivo.`:`Manuale importato: <b>${esc(p.name||p.id)}</b> (${packCounts(p)}). Resta solo su questo dispositivo.`,6000)}}

const memPct=i=>i.l?i.u/i.l:0;
async function memDevice(){try{if(!navigator.storage||!navigator.storage.estimate)return null;const e=await navigator.storage.estimate();return e&&e.quota?{n:"Spazio totale del browser",d:"tutto ciò che il Taccuino tiene sul dispositivo",u:e.usage||0,l:e.quota}:null}catch(e){return null}}
let memWarned={};
function memCheck(){clearTimeout(memCheck.t);memCheck.t=setTimeout(async()=>{const L=memItems();const d=await memDevice();if(d)L.push(d);
  const hot=L.filter(i=>memPct(i)>=.9&&!memWarned[i.n]);if(!hot.length)return;hot.forEach(i=>memWarned[i.n]=1);const i=hot[0];
  toast(`⚠️ Memoria quasi piena: <b>${esc(i.n)}</b> usa ${fmtB(i.u)} di ${fmtB(i.l)} (${Math.round(memPct(i)*100)}%). Fai un backup e alleggerisci (es. rimuovi un manuale o vecchie voci del diario).`,9000)},3000)}

function monAttack(e,a){const mode=UI.diceMode;const x=rnd(20),y=rnd(20);const d=mode==="adv"?Math.max(x,y):mode==="dis"?Math.min(x,y):x;const bonus=Number(a.bonus)||0;const tot=d+bonus;const crit=d===20,fum=d===1;
  const expr=crit?String(a.dmg).replace(/(\d*)d(\d+)/g,(m,n,f)=>`${Number(n||1)*2}d${f}`):a.dmg;const dm=parseRoll(expr);
  const who=`${e.name}: ${a.name}`;const pair=mode==="norm"?`${x}`:`${x}, ${y} → ${d}`;
  pushHist(who+" (colpire)",tot,`d20[${pair}] ${sgn(bonus)}`);if(dm)pushHist(who+(crit?" (danni, critico)":" (danni)"),dm.total,dm.detail);
  toast(`<div>${esc(who)}${mode!=="norm"?mode==="adv"?" (vantaggio)":" (svantaggio)":""}</div><div class="row" style="justify-content:center;gap:18px"><div><small>Colpire</small><div class="big ${crit?"crit":fum?"fumble":""}">${tot}</div></div>${dm?`<div><small>Danni</small><div class="big">${dm.total}</div></div>`:""}</div><div style="font-size:.8rem;opacity:.8">d20 [${pair}] ${sgn(bonus)}${dm?` · ${esc(dm.detail)} ${esc(a.type||"")}`:""}${crit?" · <b class=crit>Critico! Dadi raddoppiati</b>":fum?" · <b class=fumble>1 naturale</b>":""}</div>`,5000);
  if(mode!=="norm"){UI.diceMode="norm";if(UI.drawer)renderDrawer()}}

/* ricerca rapida */
function cmdResults(q){q=q.trim();
  if(q.length<2)return `<div class="muted mhint">Scrivi una parola (es. <i>lottare</i>, <i>prono</i>, <i>palla di fuoco</i>, <i>goblin</i>) oppure una formula di dadi come <i>3d6+2</i>.</div>`;
  const out=[];
  if(/^[+-]?\d*d\d+([+-](\d*d)?\d+)*$/i.test(q.replace(/\s+/g,""))&&parseRoll(q))out.push(`<button class="btn pri sm" data-a="mcmd-roll">🎲 Tira ${esc(q)}</button>`);
  const words=nrm(q).split(/\s+/).filter(Boolean);const has=s=>{const n=nrm(s);return words.every(w=>n.includes(w))};
  const rules=RULES.map(r=>({r,s:has(r.t)?3:has(r.t+" "+r.k)?2:has(r.t+" "+r.k+" "+r.x)?1:0})).filter(x=>x.s).sort((a,b)=>b.s-a.s).slice(0,6);
  if(rules.length)out.push(`<div class="mres"><span class="lbl">Regole</span>${rules.map(({r})=>`<details class="it"><summary><span class="t">📜 ${esc(r.t)}</span></summary><div class="body mtext">${esc(r.x)}</div></details>`).join("")}</div>`);
  const pr=rulesSearch(q,"","").slice(0,5);
  if(pr.length)out.push(`<div class="mres"><span class="lbl">Dai tuoi manuali</span>${pr.map(r=>ruleItem(r,false)).join("")}</div>`);
  if(!SPELLDB)loadSpells();else{const sp=SPELLDB.filter(o=>has(o.n+" "+(o.en||""))).slice(0,5);
    if(sp.length)out.push(`<div class="mres"><span class="lbl">Incantesimi</span>${sp.map(o=>{const v=dbView(o);return `<details class="it"><summary><span class="t">🔮 ${esc(v.name)} <small class="muted">${v.level?v.level+"° liv.":"trucchetto"} · ${esc(v.school)}</small></span></summary><div class="body"><div class="muted" style="font-size:.82rem">${esc([v.time,v.range,v.comp,v.duration+(v.conc?" (concentrazione)":"")].join(" · "))}</div><div class="mtext">${esc(v.desc)}</div>${v.higher?`<div class="mtext"><b>Ai livelli superiori.</b> ${esc(v.higher)}</div>`:""}</div></details>`}).join("")}</div>`)}
  if(!MONDB)loadMons();
  const mons=presetList().filter(p=>qMatch(q,p.name+" "+(p.en||""))).slice(0,6);
  const best=camp().master.bestiary.filter(t=>has(t.name)).slice(0,4);
  if(mons.length||best.length)out.push(`<div class="mres"><span class="lbl">Mostri</span>${best.map(t=>monRow(t.name,"Il mio bestiario · "+monStatLine(t),`data-a="mb-add" data-id="${t.id}"`,`data-a="mb-info" data-id="${t.id}"`)).join("")}${mons.map(p=>monRow(p.name,monStatLine({cr:p.cr,ac:p.ac,hp:p.hp,init:(p.o||{}).ini??(MON_BASE[Number(p.key.slice(2))]||{}).init})+(p.t?" · "+esc(p.t):""),`data-a="mp-add" data-k="${p.key}"`,`data-a="mp-info" data-k="${p.key}"`)).join("")}</div>`);
  const notes=camp().master.notes.filter(n=>has(n.title+" "+n.text)).slice(0,3);
  if(notes.length)out.push(`<div class="mres"><span class="lbl">I tuoi appunti</span>${notes.map(n=>{const i=nrm(n.text).indexOf(words[0]);const sn=i<0?n.text.slice(0,140):(i>50?"…":"")+n.text.slice(Math.max(0,i-50),i+110)+"…";return `<button class="mrow" data-a="note-go" data-id="${n.id}"><b>📝 ${esc(n.title||"Senza titolo")}</b><small class="muted">${esc(sn)}</small></button>`}).join("")}</div>`);
  return out.join("")||`<div class="muted mhint">Nessun risultato per «${esc(q)}».</div>`}
function monRow(name,sub,addAttrs,infoAttrs){return `<div class="mrow2"><button class="mrow" ${infoAttrs}><b>👹 ${esc(name)}</b><small class="muted">${sub}</small></button><button class="btn sm" ${addAttrs} title="Aggiungi al combattimento">+ ⚔</button></div>`}

  const tot=L.length;L=L.slice(0,40);
  return (L.map(p=>`<div class="mrow2"><button class="mrow" data-a="mp-info" data-k="${p.key}"><b>${esc(p.name)}</b><small class="muted">GS ${esc(p.cr)} · CA ${p.ac} · PF ${esc(p.hp)}${p.t?" · "+esc(p.t):""}${p.fo?" · 📦 "+esc(p.fo):""}</small></button>${UI.tab==="bestiario"?"":`<button class="btn sm" data-a="mp-save" data-k="${p.key}" title="Salva nel mio bestiario">☆</button><button class="btn sm" data-a="mp-add" data-k="${p.key}" title="Aggiungi al combattimento">+ ⚔</button>`}</div>`).join("")||`<div class="empty">Nessun mostro trovato.</div>`)+(tot>40?`<div class="muted mhint">Altri ${tot-40}: affina la ricerca.</div>`:"")+(!MONDB?`<div class="muted mhint">${monErr?"Elenco completo non disponibile offline: mostro i preset base.":"Carico 334 mostri…"}</div>`:"")}
function rulesSearch(q,src,cap){const words=nrm(q.trim()).split(/\s+/).filter(Boolean);let L=PACKRULES.filter(r=>(!src||r.fo===src)&&(!cap||r.c===cap));
  if(!words.length)return L;const has=s=>{const n=nrm(s);return words.every(w=>n.includes(w))};
  return L.map(r=>({r,s:has(r.n)?3:has(r.g+" "+r.n)?2:has(r.x)?1:0})).filter(o=>o.s).sort((a,b)=>b.s-a.s).map(o=>o.r)}

function afterCast(c,s,lvl,ritual){
  let msg=`<div>${esc(s.name)}${lvl?` · slot liv. ${lvl}`:ritual?" · rituale":""}</div>`;
  if(s.conc){if(c.concentration&&c.concentration!==s.name)msg+=`<div>Concentrazione su ${esc(c.concentration)} interrotta.</div>`;c.concentration=s.name;msg+=`<div>Ora sei concentrato.</div>`}
  if(s.dmg){const r=parseRoll(s.dmg);if(r){msg+=`<div class="big">${r.total}</div><div style="font-size:.8rem">${esc(r.detail)}</div>`;pushHist(s.name,r.total,r.detail)}}
  toast(msg,4000);touch();render();
}

  <div class="row"><button class="btn" data-a="hd-roll" ${left>0&&c.hp.cur<c.hp.max?"":"disabled"}>Spendi 1 dado vita</button><button class="btn pri" data-a="short-done">Termina riposo</button></div>
  <p class="muted" style="margin:0;font-size:.8rem">Alla fine si ricaricano le capacità impostate su "Riposo breve".</p>`)}
function sortCombat(){const cb=camp().combat;const cur=cb.list[cb.turn];cb.list.sort((a,b)=>(Number(b.init)||0)-(Number(a.init)||0));cb.turn=cb.started?Math.max(0,cb.list.indexOf(cur)):0}
function newRound(){const k=camp();k.combat.round++;const ended=[];

    modal(`<h2>Importa backup</h2><p style="margin:0">Il file contiene ${list.length} campagn${list.length>1?"e":"a"}: ${list.map(k=>`<b>${esc(k.name)}</b>`).join(", ")}.</p>
      <div class="row"><button class="btn pri" data-a="imp-add">Aggiungi alle mie</button><button class="btn danger" data-a="imp-replace">Sostituisci tutto</button><button class="btn ghost" data-a="modal-close">Annulla</button></div>`);
  }catch(err){toast("Questo file non è un backup del Taccuino.")}
});

/* ============ avvio ============ */
/* ============ codice di accesso (solo sito, cancello di cortesia) ============ */
async function accHash(code){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(window.ACCESS.salt+":"+code));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function boot(){load();render();loadSpells();packsLoad();}
(function(){const A=window.ACCESS;if(!A||!A.hash||!(window.crypto&&crypto.subtle)||ls.get("ddf-access")===A.hash){boot();return}
  const g=document.createElement("div");g.id="gate";g.setAttribute("role","dialog");g.setAttribute("aria-modal","true");
  g.style.cssText="position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:16px;background:#12141C;color:#f3ead8;font:16px system-ui,sans-serif";
  g.innerHTML=`<form style="display:grid;gap:12px;width:min(320px,100%);text-align:center"><div style="font-size:2.4rem" aria-hidden="true">🗝️</div><b style="font-size:1.25rem">Taccuino dell'Avventuriero</b><label for="gate-in" style="opacity:.8">Inserisci il codice di accesso</label><input id="gate-in" type="password" inputmode="numeric" autocomplete="current-password" style="font-size:1.4rem;text-align:center;letter-spacing:.3em;padding:10px;border-radius:10px;border:1px solid #5a4d3a;background:#1d2030;color:inherit"><button style="padding:10px;border-radius:10px;border:0;background:#8E2236;color:#fff;font-size:1rem">Entra</button><small id="gate-err" style="color:#ff9a8a;min-height:1.2em" aria-live="polite"></small></form>`;
  document.body.appendChild(g);const i=g.querySelector("input");setTimeout(()=>i.focus(),50);
  g.querySelector("form").addEventListener("submit",async e=>{e.preventDefault();const h=await accHash(i.value.trim());
    if(h===A.hash){ls.set("ddf-access",h);g.remove();boot()}else{g.querySelector("#gate-err").textContent="Codice non corretto";i.select()}})})();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){ls.set("ddf-state",JSON.stringify(S));pushCloud()}});
window.addEventListener("pagehide",()=>ls.set("ddf-state",JSON.stringify(S)));
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
initCloud();initShare();
})();
</script>
